<div class="mx-auto max-w-7xl px-3 py-3.5">
  <main class="min-w-0">
    <div class="mx-auto max-w-2xl">
      <section class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm sm:p-6">
        <div class="mb-5 flex items-center gap-3">
          <span class="inline-flex h-10 w-10 items-center justify-center rounded-full bg-[#e7f3ff] text-[#1877f2]">
            <i class="fa-solid fa-key text-base"></i>
          </span>
          <div>
            <h1 class="text-xl font-extrabold text-slate-900 sm:text-2xl">Change Password</h1>
            <p class="text-sm text-slate-500">Keep your account secure by using a strong password.</p>
          </div>
        </div>

        <form [formGroup]="changePasswordForm" (ngSubmit)="submit()" novalidate class="space-y-4">
          @if (serverError()) {
            <div class="rounded-xl border border-rose-200 bg-rose-50 px-4 py-3 text-sm font-semibold text-rose-700">
              {{ serverError() }}
            </div>
          }

          <label class="block">
            <span class="mb-1.5 block text-sm font-bold text-slate-700">Current password</span>
            <input
              placeholder="Enter current password"
              [class.!border-rose-300]="hasError('currentPassword')"
              class="w-full rounded-xl border bg-slate-50 px-3 py-2.5 text-sm text-slate-800 outline-none transition border-slate-200 focus:border-[#1877f2] focus:bg-white"
              type="password"
              formControlName="currentPassword"
              name="currentPassword"
            />
            @if (hasError('currentPassword')) {
              <p class="mt-1 text-xs text-rose-500">{{ getErrorMessage('currentPassword') }}</p>
            }
          </label>

          <label class="block">
            <span class="mb-1.5 block text-sm font-bold text-slate-700">New password</span>
            <input
              placeholder="Enter new password"
              [class.!border-rose-300]="hasError('newPassword')"
              class="w-full rounded-xl border bg-slate-50 px-3 py-2.5 text-sm text-slate-800 outline-none transition border-slate-200 focus:border-[#1877f2] focus:bg-white"
              type="password"
              formControlName="newPassword"
              name="newPassword"
            />
            <span class="mt-1 block text-xs text-slate-500">At least 8 characters with uppercase, lowercase, number, and special character.</span>
            @if (hasError('newPassword')) {
              <p class="mt-1 text-xs text-rose-500">{{ getErrorMessage('newPassword') }}</p>
            }
          </label>

          <label class="block">
            <span class="mb-1.5 block text-sm font-bold text-slate-700">Confirm new password</span>
            <input
              placeholder="Re-enter new password"
              [class.!border-rose-300]="hasError('confirmPassword')"
              class="w-full rounded-xl border bg-slate-50 px-3 py-2.5 text-sm text-slate-800 outline-none transition border-slate-200 focus:border-[#1877f2] focus:bg-white"
              type="password"
              formControlName="confirmPassword"
              name="confirmPassword"
            />
            @if (hasError('confirmPassword')) {
              <p class="mt-1 text-xs text-rose-500">{{ getErrorMessage('confirmPassword') }}</p>
            }
          </label>

          @if (successMessage()) {
            <div class="rounded-xl border border-emerald-200 bg-emerald-50 px-4 py-3 text-sm font-semibold text-emerald-700">
              {{ successMessage() }}
            </div>
          }

          <button
            type="submit"
            [disabled]="changePasswordForm.invalid || isLoading()"
            class="inline-flex w-full items-center justify-center rounded-xl bg-[#1877f2] px-4 py-2.5 text-sm font-bold text-white transition hover:bg-[#166fe5] disabled:cursor-not-allowed disabled:opacity-60 cursor-pointer"
          >
            @if (isLoading()) {
              <i class="fa-solid fa-spinner fa-spin mr-2"></i>
              <span>Updating...</span>
            } @else {
              <span>Update password</span>
            }
          </button>
        </form>
      </section>
    </div>
  </main>
</div>
