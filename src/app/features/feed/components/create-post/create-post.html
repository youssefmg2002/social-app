<div class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">
  <div class="mb-3 flex items-start gap-3">
    <img [alt]="user?.name" class="h-11 w-11 rounded-full object-cover" [src]="user?.photo || defaultPhoto" />
    <div class="flex-1">
      <p class="text-base font-extrabold text-slate-900">{{ user?.name }}</p>
      <div class="relative inline-block text-left">
        <button
          type="button"
          (click)="togglePrivacy($event)"
          class="mt-1 inline-flex items-center gap-1.5 rounded-full bg-slate-100 px-2.5 py-1 text-xs font-semibold text-slate-700 transition hover:bg-slate-200 cursor-pointer"
        >
          @switch (privacy()) {
            @case ('following') {
              <i class="fa-solid fa-user-group text-slate-600 text-xs"></i>
            }
            @case ('only_me') {
              <i class="fa-solid fa-lock text-slate-600 text-xs"></i>
            }
            @default {
              <i class="fa-solid fa-earth-americas text-slate-600 text-xs"></i>
            }
          }
          <span>{{ privacyLabel() }}</span>
          <i class="fa-solid fa-chevron-down text-slate-500 text-[10px] transition-transform duration-150" [class.rotate-180]="privacyOpen()"></i>
        </button>

        @if (privacyOpen()) {
          <div class="absolute left-0 z-30 mt-1.5 w-36 overflow-hidden rounded-xl border border-slate-200 bg-white py-1 shadow-lg">
            <button
              type="button"
              (click)="selectPrivacy('public', $event)"
              class="flex w-full items-center gap-2 px-3 py-1.5 text-left text-xs font-semibold text-slate-700 transition hover:bg-slate-50 cursor-pointer"
              [class.bg-[#e7f3ff]]="privacy() === 'public'"
              [class.text-[#1877f2]]="privacy() === 'public'"
            >
              <i class="fa-solid fa-earth-americas text-xs"></i>
              <span>Public</span>
            </button>
            <button
              type="button"
              (click)="selectPrivacy('following', $event)"
              class="flex w-full items-center gap-2 px-3 py-1.5 text-left text-xs font-semibold text-slate-700 transition hover:bg-slate-50 cursor-pointer"
              [class.bg-[#e7f3ff]]="privacy() === 'following'"
              [class.text-[#1877f2]]="privacy() === 'following'"
            >
              <i class="fa-solid fa-user-group text-xs"></i>
              <span>Followers</span>
            </button>
            <button
              type="button"
              (click)="selectPrivacy('only_me', $event)"
              class="flex w-full items-center gap-2 px-3 py-1.5 text-left text-xs font-semibold text-slate-700 transition hover:bg-slate-50 cursor-pointer"
              [class.bg-[#e7f3ff]]="privacy() === 'only_me'"
              [class.text-[#1877f2]]="privacy() === 'only_me'"
            >
              <i class="fa-solid fa-lock text-xs"></i>
              <span>Only me</span>
            </button>
          </div>
        }
      </div>
    </div>
  </div>

  <div class="relative">
    <textarea
      rows="4"
      [placeholder]="placeholder"
      [value]="body()"
      (input)="onBodyInput($event)"
      class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-[17px] leading-relaxed text-slate-800 outline-none transition focus:border-[#1877f2] focus:bg-white"
    ></textarea>
  </div>

  @if (imagePreview(); as preview) {
    <div class="relative mt-3 overflow-hidden rounded-xl border border-slate-200">
      <img [src]="preview" alt="Selected image" class="max-h-80 w-full object-cover" />
      <button
        type="button"
        (click)="removeImage()"
        class="absolute right-2 top-2 flex h-8 w-8 items-center justify-center rounded-full bg-black/60 text-white transition hover:bg-black/75"
        aria-label="Remove image"
      >
        <i class="fa-solid fa-xmark text-sm"></i>
      </button>
    </div>
  }

  @if (errorMessage()) {
    <p class="mt-2 rounded-xl border border-red-200 bg-red-50 p-2.5 text-sm font-medium text-red-600">{{ errorMessage() }}</p>
  }

  <div class="mt-3 flex flex-wrap items-center justify-between gap-2 border-t border-slate-200 pt-3">
    <div class="relative flex items-center gap-2">
      <label class="flex cursor-pointer items-center gap-2 rounded-lg px-3 py-2 text-sm font-semibold text-slate-600 transition hover:bg-slate-100">
        <i class="fa-regular fa-image text-emerald-600 text-base"></i>
        <span class="hidden sm:inline">Photo/video</span>
        <input accept="image/*" class="hidden" type="file" (change)="onImageSelected($event)" />
      </label>
      <button
        type="button"
        (click)="toggleEmoji($event)"
        class="flex cursor-pointer items-center gap-2 rounded-lg px-3 py-2 text-sm font-semibold text-slate-600 transition hover:bg-slate-100"
        [class.text-amber-500]="showEmoji()"
      >
        <i class="fa-regular fa-face-smile text-amber-500 text-base"></i>
        <span class="hidden sm:inline">Feeling/activity</span>
      </button>
    </div>
    <div class="flex items-center gap-3">
      <button
        type="button"
        (click)="submit()"
        [disabled]="!canPost()"
        class="flex items-center gap-2 rounded-lg bg-[#1877f2] px-5 py-2 text-sm font-extrabold text-white shadow-sm transition-colors hover:bg-[#166fe5] disabled:opacity-60 cursor-pointer"
      >
        @if (isPosting()) {
          <i class="fa-solid fa-spinner fa-spin"></i>
        }
        Post
        <i class="fa-solid fa-paper-plane text-xs"></i>
      </button>
    </div>
  </div>

  @if (showEmoji()) {
    <div class="mt-3 inline-block overflow-hidden rounded-xl border border-slate-200 bg-white shadow-sm">
      <app-emoji-picker (emojiSelect)="addEmoji($event)" (closed)="showEmoji.set(false)" />
    </div>
  }
</div>
