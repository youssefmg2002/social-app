<h2 class="text-2xl font-extrabold text-slate-900">Log in to Route Posts</h2>
<p class="mt-1 text-sm text-slate-500">Log in and continue your social journey.</p>

<form [formGroup]="loginForm" (ngSubmit)="submitData()" novalidate class="mt-5 space-y-3.5">
  <div>
    <div class="relative">
      <span class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">
        <i class="fa-regular fa-user-alt text-base"></i>
      </span>
      <input
        type="text"
        name="login"
        formControlName="login"
        placeholder="Email or Username"
        class="w-full rounded-xl border bg-slate-50 py-3 pl-11 pr-4 text-sm text-slate-800 outline-none transition focus:bg-white"
        [class.border-red-400]="hasError('login')"
        [class.focus:border-red-500]="hasError('login')"
        [class.border-slate-200]="!hasError('login')"
        [class.focus:border-[#00298d]]="!hasError('login')"
      />
    </div>
    @if (getErrorMessage('login')) {
      <p class="mt-1 text-xs text-red-500">{{ getErrorMessage('login') }}</p>
    }
  </div>

  <div>
    <div class="relative">
      <span class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">
        <i class="fa-solid fa-key text-base"></i>
      </span>
      <input
        type="password"
        name="password"
        formControlName="password"
        placeholder="Password"
        class="w-full rounded-xl border bg-slate-50 py-3 pl-11 pr-4 text-sm text-slate-800 outline-none transition focus:bg-white"
        [class.border-red-400]="hasError('password')"
        [class.focus:border-red-500]="hasError('password')"
        [class.border-slate-200]="!hasError('password')"
        [class.focus:border-[#00298d]]="!hasError('password')"
      />
    </div>
    @if (getErrorMessage('password')) {
      <p class="mt-1 text-xs text-red-500">{{ getErrorMessage('password') }}</p>
    }
  </div>

  <button
    type="submit"
    [disabled]="isLoading()"
    class="w-full rounded-xl py-3 text-base font-extrabold text-white transition disabled:opacity-60 bg-[#00298d] hover:bg-[#001f6b] cursor-pointer flex items-center justify-center gap-2"
  >
    @if (isLoading()) {
      <i class="fa-solid fa-spinner fa-spin"></i>
    }
    <span>Login</span>
  </button>

  @if (serverError() != '') {
    <div
      class="rounded-xl border border-red-200 bg-red-50 p-3.5 text-sm font-medium text-red-600"
    >
      {{ serverError() }}
    </div>
  }

  <div class="pt-2 text-center">
    <a
      routerLink="/forgot-password"
      class="text-sm font-bold text-[#00298d] hover:underline transition"
    >
      Forgot Password?
    </a>
  </div>
</form>
