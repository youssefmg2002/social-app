<div class="mx-auto max-w-3xl space-y-4">
  <button
    type="button"
    (click)="goBack()"
    class="inline-flex items-center gap-2 rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm font-bold text-slate-700 transition hover:bg-slate-50 cursor-pointer"
  >
    <i class="fa-solid fa-arrow-left text-sm"></i>
    Back
  </button>

  @if (isLoading()) {
    <div class="animate-pulse rounded-xl border border-slate-200 bg-white p-4 shadow-sm">
      <div class="flex items-center gap-3">
        <div class="h-11 w-11 rounded-full bg-slate-200"></div>
        <div class="flex-1 space-y-2">
          <div class="h-3 w-1/3 rounded bg-slate-200"></div>
          <div class="h-3 w-1/4 rounded bg-slate-200"></div>
        </div>
      </div>
      <div class="mt-4 h-3 w-3/4 rounded bg-slate-200"></div>
      <div class="mt-2 h-64 rounded-lg bg-slate-100"></div>
    </div>
  } @else if (errorMessage()) {
    <div class="rounded-xl border border-red-200 bg-red-50 p-6 text-center text-sm font-semibold text-red-600 shadow-sm">
      <p>{{ errorMessage() }}</p>
      <button
        type="button"
        (click)="loadPost()"
        class="mt-3 text-xs font-bold text-[#1877f2] hover:underline cursor-pointer"
      >
        Try again
      </button>
    </div>
  } @else if (post(); as p) {
    <app-post-card [post]="p" (postDeleted)="onPostDeleted()" />
  }
</div>
